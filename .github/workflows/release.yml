name: Verify release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify tag matches the release version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "$(cut -d+ -f1 VERSION)"
      # Workspace packages resolve @moderado/* through their dist entry points,
      # which are build outputs and never committed.
      - run: npm run build
      - run: npm test
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: moderado-npm-package
          path: apps/cli/*.tgz

  binary-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: node22-win-x64
          - runner: macos-latest
            target: node22-macos-arm64
          - runner: ubuntu-latest
            target: node22-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Workspace packages resolve @moderado/* through their dist entry points,
      # which are build outputs and never committed.
      - run: npm run build
      - run: npm test
      - run: npm run build:binaries -- --target ${{ matrix.target }} --revision ${{ github.sha }}
      - run: npm run verify:binaries -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: moderado-binary-${{ matrix.target }}
          path: artifacts/*/${{ matrix.target }}

  binary-metadata:
    needs: binary-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: moderado-binary-node22-win-x64
          path: collected/win
      - uses: actions/download-artifact@v4
        with:
          name: moderado-binary-node22-macos-arm64
          path: collected/macos
      - uses: actions/download-artifact@v4
        with:
          name: moderado-binary-node22-linux-x64
          path: collected/linux
      - run: npm run merge-binaries -- --source collected/win,collected/macos,collected/linux --output artifacts/release --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: moderado-binaries
          path: artifacts/release
